name: Build binaries

# Produces standalone AutoPresser binaries for Windows and macOS.
# PyInstaller can't cross-compile, so each binary is built on its own runner.

on:
  push:
    branches: [master, test]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: autopresser-windows
          - os: macos-latest
            artifact: autopresser-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ runner.os == 'Windows' && 'windows' || 'macos' }}/
          if-no-files-found: error
